[project]
name = "canon-app"
version = "0.7.25"
description = "Canon TUI — a unified experience for AI in your terminal."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual[syntax]>=8.1.1",
    "click>=8.2.1",
    "tree-sitter>=0.24.0",
    "httpx>=0.28.1",
    "platformdirs>=4.9.4",
    "rich>=14.3.3",
    "typeguard==4.4.4",
    "xdg-base-dirs>=6.0.2",
    "textual-serve>=1.1.2",
    "textual-speedups==0.2.1",
    "packaging>=25.0",
    "bashlex>=0.18",
    "pathspec>=0.12.1",
    "notify-py>=0.3.43",
    "pyperclip>=1.11.0",
    "watchdog>=6.0.0",
    "setproctitle>=1.3.7",
    "psutil>=7.2.1",
    "aiosqlite>=0.22.1",
    "pyyaml>=6.0.2",
    "nostr-sdk>=0.45.1",
    "web3>=7.16.0",
]

[project.urls]
Homepage = "https://github.com/DEGAorg/canon"
Repository = "https://github.com/DEGAorg/canon"
Issues = "https://github.com/DEGAorg/canon/issues"
Changelog = "https://github.com/DEGAorg/canon/blob/main/CHANGELOG.md"

[tool.uv.workspace]
members = [
    "toad",
]
exclude = [
    "src/toad/extensions/*",
]

[tool.uv.sources]
#textual-serve = { path = "../textual-serve", editable = true }
#textual = { path = "../textual", editable = true }
#textual-dev = { path = "../textual-dev", editable = true }
#rich = { path = "../rich", editable = true }

[project.scripts]
canon = "toad.cli:main"
canon-ctl = "toad.ctl:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toad"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pyinstrument>=5.1.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "textual-dev>=1.8.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.168.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
